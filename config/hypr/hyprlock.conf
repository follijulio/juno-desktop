# Todas as saídas. Nenhuma imagem da sessão fica visível durante o bloqueio.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(FFFDF5)
    blur_passes = 0
    noise = 0
    brightness = 1
    contrast = 1
    vibrancy = 0
}

label {
    monitor =
    text = JUNO
    color = rgb(111111)
    font_size = 24
    font_family = Roboto Black
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(111111)
    font_size = 64
    font_family = Space Mono
    position = 0, 66
    halign = center
    valign = center
    shadow_passes = 0
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    outer_color = rgb(111111)
    inner_color = rgb(FFFFFF)
    font_color = rgb(111111)
    font_family = Roboto
    placeholder_text = Digite sua senha
    check_text = Verificando…
    fail_text = Senha incorreta. Tente novamente.
    check_color = rgb(FFCC00)
    fail_color = rgb(FF9B85)
    capslock_color = rgb(FFE066)
    numlock_color = rgb(111111)
    bothlock_color = rgb(FFE066)
    fade_on_empty = false
    hide_input = false
    rounding = 0
    dots_rounding = 0
    dots_size = 0.22
    dots_spacing = 0.3
    shadow_passes = 0
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = Sessão bloqueada · ABNT2
    color = rgb(111111)
    font_size = 12
    font_family = Space Mono
    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 0
}
