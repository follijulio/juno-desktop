# A imagem é a seleção persistida da galeria, nunca uma captura da sessão.
# O comando Juno lock gera uma cópia privada e preenche o marcador abaixo.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = # JUNO_WALLPAPER
    color = rgb(FFFDF5)
    blur_passes = 0
    noise = 0
    brightness = 1
    contrast = 1
    vibrancy = 0
    zindex = -4
}

# A sombra é um retângulo deslocado; todos os painéis são opacos.
shape {
    monitor =
    size = 520, 500
    color = rgb(111111)
    rounding = 0
    border_size = 0
    position = 8, -8
    halign = center
    valign = center
    shadow_passes = 0
    zindex = -3
}

shape {
    monitor =
    size = 520, 500
    color = rgb(FFFDF5)
    rounding = 0
    border_size = 4
    border_color = rgb(111111)
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 0
    zindex = -2
}

shape {
    monitor =
    size = 440, 44
    color = rgb(B8F2E6)
    rounding = 0
    border_size = 2
    border_color = rgb(111111)
    position = 0, 185
    halign = center
    valign = center
    shadow_passes = 0
    zindex = -1
}

label {
    monitor =
    text = JUNO / TEMPO PARA RESPIRAR
    color = rgb(111111)
    font_size = 12
    font_family = Space Mono Bold
    position = 0, 185
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(111111)
    font_size = 64
    font_family = Space Mono Bold
    position = 0, 95
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor =
    text = cmd[update:60000] date '+%d / %m / %Y'
    color = rgb(111111)
    font_size = 13
    font_family = Space Mono
    position = 0, 29
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor =
    text = Olá, $USER.
    color = rgb(111111)
    font_size = 18
    font_family = Roboto Bold
    position = 0, -28
    halign = center
    valign = center
    shadow_passes = 0
}

input-field {
    monitor =
    size = 420, 60
    outline_thickness = 2
    outer_color = rgb(111111)
    inner_color = rgb(FFFFFF)
    font_color = rgb(111111)
    font_family = Roboto
    placeholder_text = Sua senha · Enter para voltar
    check_text = Verificando…
    fail_text = Senha incorreta. Tente novamente.
    check_color = rgb(FFCC00)
    fail_color = rgb(FF9B85)
    capslock_color = rgb(FFE066)
    numlock_color = rgb(111111)
    bothlock_color = rgb(FFE066)
    fade_on_empty = false
    hide_input = false
    rounding = 0
    dots_rounding = 0
    dots_size = 0.22
    dots_spacing = 0.3
    shadow_passes = 0
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = SESSÃO BLOQUEADA / ABNT2
    color = rgb(111111)
    font_size = 11
    font_family = Space Mono
    position = 0, -175
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor =
    text = Seu trabalho espera por você.
    color = rgb(111111)
    font_size = 12
    font_family = Roboto
    position = 0, -207
    halign = center
    valign = center
    shadow_passes = 0
}
