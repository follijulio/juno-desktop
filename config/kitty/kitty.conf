# Nerd Font com variantes reais: pacote Arch ou recursos oficiais locais no Zorin.
font_family JetBrainsMono Nerd Font Mono
bold_font JetBrainsMono Nerd Font Mono Bold
italic_font JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size 12.0
shell /bin/bash
disable_ligatures always

# O terminal usa tinta no fundo para os acentos ANSI continuarem legíveis.
# Esta superfície técnica mantém a paleta Netuno; as outras usam papel creme.
background #111111
foreground #FFFDF5
background_opacity 1.0
selection_background #FFCC00
selection_foreground #111111
cursor #FF5B35
cursor_text_color #111111
cursor_shape block
cursor_blink_interval 0
cursor_trail 0
repaint_delay 10
window_padding_width 12
window_border_width 2px
active_border_color #111111
inactive_border_color #111111
bell_border_color #FF9B85
inactive_text_alpha 1.0
enable_audio_bell no
visual_bell_duration 0
hide_window_decorations yes
confirm_os_window_close 1
remember_window_size yes

tab_bar_style separator
tab_separator " | "
tab_title_template "{index}: {title}"
active_tab_background #FFCC00
active_tab_foreground #111111
active_tab_font_style bold
inactive_tab_background #F4EDDB
inactive_tab_foreground #111111
inactive_tab_font_style normal
tab_bar_background #111111
tab_bar_margin_color #111111
url_color #FFFDF5
url_style straight

# ANSI preserva apenas as nove cores da identidade, inclusive os claros.
color0 #111111
color1 #FF5B35
color2 #B8F2E6
color3 #FFCC00
color4 #F4EDDB
color5 #FF9B85
color6 #FFE066
color7 #FFFDF5
color8 #F4EDDB
color9 #FF9B85
color10 #B8F2E6
color11 #FFE066
color12 #F4EDDB
color13 #FF5B35
color14 #FFCC00
color15 #FFFFFF

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
